name: Release & Build

on:
  push:
    branches:
      - master # Мажорные релизы
      - dev    # Минорные релизы

permissions:
  contents: write # Нужно для создания Release и тега

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Важно для git-cliff, чтобы он видел историю тегов

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 1. Генерация описания релиза ТОЛЬКО для коммитов с последнего тега
      # Мы НЕ коммитим этот файл, он существует только во время сборки
      - name: Generate Release Notes
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # --latest: берет изменения только с предыдущего тега
          # --output: сохраняет результат во временный файл
          args: --latest --output RELEASE_NOTES.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      # 2. Сборка артефактов для всех платформ
      - name: Build Artifacts
        run: |
          ./gradlew assembleRelease              # Android APK/AAB
          ./gradlew packageReleaseJar            # Desktop JVM (исправлена опечатка)
          ./gradlew wasmJsBrowserDistribution    # Web WASM

      # 3. Упаковка Web-артефактов в один ZIP-архив
      # Это решает проблему "стены" из десятков отдельных .js, .wasm и .map файлов
      - name: Zip Web Distribution
        run: |
          cd composeApp/build/dist/wasmJs/
          zip -r web-release.zip productionExecutable/

      # 4. Создание GitHub Release
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          # Создаем тег на основе текущего коммита (без необходимости делать git commit заранее)
          commit: ${{ github.sha }}
          # Используем версию, которую определил git-cliff, или задайте свою логику
          tag: "v${{ steps.changelog.outputs.version }}"
          name: "Release ${{ steps.changelog.outputs.version }}"
          # Читаем описание из временного файла, который мы создали на шаге 1
          bodyFile: "RELEASE_NOTES.md"
          artifacts: |
            # --- ANDROID ---
            androidApp/build/outputs/apk/release/*.apk
            
            # --- DESKTOP (JVM) ---
            composeApp/build/libs/*.jar
            
            # --- WEB (WASM) ---
            # Теперь загружается один аккуратный архив, а не 10 отдельных файлов
            composeApp/build/dist/wasmJs/web-release.zip
