name: Release & Build
on:
  push:
    branches:
      - master
      - dev
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 1. Вычисляем версию с учетом ветки
      - name: Generate Changelog and Bump Version
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # Если это dev, передаем флаг --prerelease dev, который сделает версию вида 1.2.0-dev.0
          args: >
            --verbose --bump 
            ${{ github.ref == 'refs/heads/dev' && '--prerelease dev' || '' }}
        env:
          GITHUB_REPO: ${{ github.repository }}

      # 2. Вешаем локальный тег для Gradle
      - name: Apply temporary local tag for Gradle
        run: |
          NEW_VERSION="${{ steps.changelog.outputs.version }}"
          if [[ ! "$NEW_VERSION" =~ ^v ]]; then
            NEW_VERSION="v$NEW_VERSION"
          fi
          git tag "$NEW_VERSION"
          echo "Локальный тег $NEW_VERSION установлен"

      # 3. Сборка артефактов (Web, Desktop, Android получат версию с -dev или чистую)
      - name: Build Artifacts
        run: |
          ./gradlew assembleRelease
          ./gradlew packageReleaseJar
          ./gradlew wasmJsBrowserDistribution

      # 4. Публикация релиза на GitHub
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: "${{ steps.changelog.outputs.version }}"
          name: "${{ github.ref == 'refs/heads/dev' && 'Dev Build ' || 'Release ' }}${{ steps.changelog.outputs.version }}"
          body: "${{ steps.changelog.outputs.changelog }}"
          # Важно: ставим галочку prerelease, если сборка идет из ветки dev
          prerelease: ${{ github.ref == 'refs/heads/dev' }}
          artifacts: |
            androidApp/build/outputs/apk/release/*.apk
            composeApp/build/compose/binaries/main-release/app/*
            composeApp/build/libs/*.jar
            composeApp/build/dist/wasmJs/productionExecutable/*
          token: ${{ secrets.GITHUB_TOKEN }}
