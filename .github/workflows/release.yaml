name: Release & Build

on:
  push:
    branches:
      - master # Мажорные релизы
      - dev    # Минорные релизы

permissions:
  contents: write # Нужно для пуша CHANGELOG и создания Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 1. Повышение версии и генерация красивого CHANGELOG
      # Используем git-cliff. Он сам поймет, что было в [Unreleased] и оформит это.
      - name: Generate Changelog and Bump Version
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml # Файл конфига нужно добавить (см. совет ниже)
          args: --verbose --bump
        env:
          GITHUB_REPO: ${{ github.repository }}

      # 2. Коммит обновленного CHANGELOG и версии обратно в ветку
      - name: Commit CHANGELOG and Version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md gradle.properties # или где у тебя хранится versionName
          git commit -m "chore(release): update changelog and bump version [skip ci]"
          git push

      # 3. Сборка артефактов для всех платформ
      - name: Build Artifacts
        run: |
          ./gradlew assembleRelease              # Android APK/AAB
          ./gradlew packageReleaseJar            # Desktop JVM
          ./gradlew wasmJsBrowserDistribution    # Web WASM

      # 4. Создание GitHub Release с прикрепленными файлами
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ steps.changelog.outputs.version }}"
          name: "Release ${{ steps.changelog.outputs.version }}"
          bodyFile: "CHANGELOG.md"
          artifacts: |
            # --- ANDROID ---
            androidApp/build/outputs/apk/release/*.apk
            # androidApp/build/outputs/bundle/release/*.aab # Раскомментируй, если нужен AAB
            
            # --- DESKTOP (JVM) ---
            composeApp/build/compose/binaries/main-release/app/*
            composeApp/build/libs/*.jar
            
            # --- WEB (WASM) ---
            composeApp/build/dist/wasmJs/productionExecutable/*
