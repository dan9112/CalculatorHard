name: Release & Build
on:
  push:
    branches:
      - master
      - dev
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # Рекомендую v4, v6 еще нестабилен/редко используется
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 1. Генерация CHANGELOG и вычисление НОВОЙ версии
      - name: Generate Changelog and Bump Version
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --bump
        env:
          GITHUB_REPO: ${{ github.repository }}

      # 2. ОБНОВЛЕНИЕ gradle.properties НОВОЙ версией (ДО коммита и сборки!)
      - name: Update version in gradle.properties
        run: |
          NEW_VERSION="${{ steps.changelog.outputs.version }}"
          CLEAN_VERSION=$(echo "$NEW_VERSION" | sed 's/^v//')
          sed -i "s/^version=.*/version=$CLEAN_VERSION/" gradle.properties
          echo "Версия в gradle.properties обновлена на: $CLEAN_VERSION"

      # 3. Коммит обновленных файлов (теперь там уже НОВАЯ версия)
      - name: Commit CHANGELOG and Version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md gradle.properties
          git commit -m "chore(release): update changelog and bump version [skip ci]"
          git push

      # 4. Сборка артефактов (теперь они соберутся с НОВОЙ версией для Web, Desktop и Android)
      - name: Build Artifacts
        run: |
          ./gradlew assembleRelease
          ./gradlew packageReleaseJar
          ./gradlew wasmJsBrowserDistribution

      # 5. Создание GitHub Release
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ steps.changelog.outputs.version }}"
          name: "Release ${{ steps.changelog.outputs.version }}"
          bodyFile: "CHANGELOG.md"
          artifacts: |
            androidApp/build/outputs/apk/release/*.apk
            composeApp/build/compose/binaries/main-release/app/*
            composeApp/build/libs/*.jar
            composeApp/build/dist/wasmJs/productionExecutable/*
