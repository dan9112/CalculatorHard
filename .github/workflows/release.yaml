name: Release & Build

on:
  push:
    branches:
      - master # Мажорные релизы
      - dev    # Минорные/предрелизные сборки

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 1. Генерация текста изменений (БЕЗ коммита в репозиторий, только в память сборщика)
      - name: Generate Release Notes
        id: changelog
        uses: orhun/git-cliff-action@v4 # ИСПРАВЛЕНО: убран пробел в названии
        with:
          config: cliff.toml
          # --latest берет коммиты с прошлого тега, --output пишет во временный файл
          args: --latest --output RELEASE_NOTES.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      # 2. Сборка артефактов
      - name: Build Artifacts
        run: |
          ./gradlew assembleRelease
          ./gradlew packageReleaseJar
          ./gradlew wasmJsBrowserDistribution

      # 3. Упаковка Web-артефактов в один ZIP (РЕШАЕТ ПРОБЛЕМУ СЫРЫХ ФАЙЛОВ)
      - name: Zip Web Distribution
        run: |
          cd composeApp/build/dist/wasmJs/
          zip -r web-release.zip productionExecutable/

      # 4. Создание GitHub Release
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          # Если ветка dev -> добавляем постфикс -beta. Если master -> обычная версия.
          tag: ${{ github.ref_name == 'dev' && format('v{0}-beta', steps.changelog.outputs.version) || format('v{0}', steps.changelog.outputs.version) }}
          name: ${{ github.ref_name == 'dev' && format('Pre-release v{0}-beta', steps.changelog.outputs.version) || format('Release v{0}', steps.changelog.outputs.version) }}

          # Включаем режим Pre-release только для ветки dev
          prerelease: ${{ github.ref_name == 'dev' }}

          # Берем текст из временного файла, который мы создали на шаге 1
          bodyFile: "RELEASE_NOTES.md"

          artifacts: |
            # --- ANDROID ---
            androidApp/build/outputs/apk/release/*.apk
            
            # --- DESKTOP (JVM) ---
            composeApp/build/libs/*.jar
            
            # --- WEB (WASM) ---
            # Теперь загружается ОДИН архив, а не куча сырых файлов
            composeApp/build/dist/wasmJs/web-release.zip
