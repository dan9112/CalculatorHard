name: Release & Build

on:
  push:
    branches:
      - master
      - dev

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 1. Считаем ЧИСТУЮ семантическую версию по коммитам
      - name: Generate Release Notes and Version
        if: startsWith(github.event.head_commit.message, 'chore(release):')
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --bump --output RELEASE_NOTES.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      # 2. Ротация тегов: при релизе на master удаляем все -dev теги, влитые из dev
      - name: Rotate and Clean Prerelease Tags
        if: startsWith(github.event.head_commit.message, 'chore(release):')
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "Branch is master. Starting targeted cleanup of merged -dev prereleases..."
            TARGET_DEV_TAGS=$(git log --merge --format="%d" 2>/dev/null | grep -o 'tag: [^,)]*' | sed 's/tag: //' | grep -- '-dev$' || echo "")
            if [ -n "$TARGET_DEV_TAGS" ]; then
              UNIQUE_TAGS=$(echo "$TARGET_DEV_TAGS" | sort -u)
              for TAG in $UNIQUE_TAGS; do
                curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://github.com{{ github.repository }}/releases/tags/$TAG" || true
                curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://github.com{{ github.repository }}/git/refs/tags/$TAG" || true
              done
            fi
          fi

      # 3. Тупая склейка строк: ЧИСТАЯ ВЕРСИЯ + ПОСТФИКС. Никаких цифр после дефиса!
      - name: Assemble Strict Tag Name
        if: startsWith(github.event.head_commit.message, 'chore(release):')
        run: |
          RAW_VERSION="${{ steps.changelog.outputs.version }}"
          if [ -z "$RAW_VERSION" ]; then RAW_VERSION="0.0.1"; fi
          
          # Намертво отрезаем любые встроенные SemVer-хвосты, оставляя только цифры X.Y.Z
          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/^v//' | sed 's/-.*//')
          
          if [ "${{ github.ref_name }}" = "dev" ]; then
            FINAL_TAG="v${CLEAN_VERSION}-dev"
          else
            FINAL_TAG="v${CLEAN_VERSION}"
          fi
          
          echo "FINAL_TAG=$FINAL_TAG" >> $GITHUB_ENV

      # 4. Вешаем локальный тег в памяти сервера для корректной сборки Gradle
      - name: Apply temporary local tag for Gradle
        if: startsWith(github.event.head_commit.message, 'chore(release):')
        run: |
          git tag -f "${{ env.FINAL_TAG }}"

      # 5. Компиляция проекта (Android, Desktop, Web)
      - name: Build Artifacts
        run: |
          ./gradlew assembleRelease
          ./gradlew packageReleaseJar
          ./gradlew wasmJsBrowserDistribution

      # 6. Пакуем Web-версию в один ZIP архив
      - name: Zip Web Distribution
        run: |
          cd composeApp/build/dist/wasmJs/
          zip -r web-release.zip productionExecutable/

      # 7. Создаем релиз на GitHub и прикрепляем файлы
      - name: Create GitHub Release
        if: startsWith(github.event.head_commit.message, 'chore(release):')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.FINAL_TAG }}
          name: ${{ github.ref_name == 'dev' && format('Pre-release {0}', env.FINAL_TAG) || format('Release {0}', env.FINAL_TAG) }}
          prerelease: ${{ github.ref_name == 'dev' }}
          bodyFile: "RELEASE_NOTES.md"
          artifacts: |
            androidApp/build/outputs/apk/release/*-release-unsigned.apk
            composeApp/build/libs/*-jvm.jar
            composeApp/build/dist/wasmJs/web-release.zip
          token: ${{ secrets.GITHUB_TOKEN }}
