name: Release & Build

on:
  push:
    branches:
      - master
      - dev

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 1. Вычисляем версию (Только если есть триггер)
      - name: Generate Release Notes
        if: startsWith(github.event.head_commit.message, 'chore(release):')
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --bump --output RELEASE_NOTES.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      # 2. Ротация тегов: на dev — копим, на master — начисто удаляем все старые -dev теги
      - name: Rotate and Clean Prerelease Tags
        if: startsWith(github.event.head_commit.message, 'chore(release):')
        run: |
          # 1. Если мы на ветке dev, ничего не удаляем, просто пропускаем шаг
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "Branch is dev. Accumulating prerelease tags without deletion."
          fi
          
          # 2. Если мы на ветке master, запускаем полную зачистку всех -dev тегов
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "Branch is master. Starting total cleanup of all legacy -dev prereleases..."
          
            # Получаем список всех тегов из GitHub API, фильтруем те, что заканчиваются на -dev
            DEV_TAGS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://github.com{{ github.repository }}/releases" | \
              jq -r '.[] | select(.prerelease == true) | .tag_name' | grep -- '-dev$' || echo "")
          
            if [ -z "$DEV_TAGS" ]; then
              echo "No old -dev tags found to clean up."
            else
              for TAG in $DEV_TAGS; do
                echo "Cleaning up stale prerelease tag: $TAG"
          
                # Удаляем сам релиз из интерфейса GitHub
                curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  "https://github.com{{ github.repository }}/releases/tags/$TAG" || true
          
                # Удаляем физический Git-тег с сервера
                curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  "https://github.com{{ github.repository }}/git/refs/tags/$TAG" || true
              done
              echo "All legacy -dev tags have been successfully wiped out."
            fi
          fi

      # 3. Вешаем новый локальный тег в память для Gradle
      - name: Apply temporary local tag for Gradle
        if: startsWith(github.event.head_commit.message, 'chore(release):')
        run: |
          RAW_VERSION="${{ steps.changelog.outputs.version }}"
          if [ -z "$RAW_VERSION" ]; then RAW_VERSION="0.0.1"; fi
          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/^v//')
          
          if [ "${{ github.ref_name }}" = "dev" ]; then
            NEW_TAG="v${CLEAN_VERSION}-dev"
          else
            NEW_TAG="v${CLEAN_VERSION}"
          fi
          
          git tag "$NEW_TAG"
          echo "FINAL_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "Локальный тег $NEW_TAG установлен для Gradle"

      # 4. Сборка артефактов (Запускается ВСЕГДА на любой push для проверки кода)
      - name: Build Artifacts
        run: |
          ./gradlew assembleRelease
          ./gradlew packageReleaseJar
          ./gradlew wasmJsBrowserDistribution

      # 5. Упаковка Web-артефактов в один ZIP (Запускается ВСЕГДА)
      - name: Zip Web Distribution
        run: |
          cd composeApp/build/dist/wasmJs/
          zip -r web-release.zip productionExecutable/

      # 6. Создание нового GitHub Release (Только если есть триггер)
      - name: Create GitHub Release
        if: startsWith(github.event.head_commit.message, 'chore(release):')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.FINAL_TAG }}
          name: ${{ github.ref_name == 'dev' && format('Pre-release {0}', env.FINAL_TAG) || format('Release {0}', env.FINAL_TAG) }}
          prerelease: ${{ github.ref_name == 'dev' }}
          bodyFile: "RELEASE_NOTES.md"
          artifacts: |
            androidApp/build/outputs/apk/release/*-release-unsigned.apk
            composeApp/build/libs/*-jvm.jar
            composeApp/build/dist/wasmJs/web-release.zip
          token: ${{ secrets.GITHUB_TOKEN }}
