name: CI Checks

on:
  pull_request:
    branches: [ dev, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. Строгая проверка стиля (на сервере мы не чиним, а падаем, если стиль бит)
      - name: Run Spotless Check
        run: ./gradlew spotlessCheck

      # 2. Запуск всех тестов
      - name: Run Tests
        run: ./gradlew test
