pre-commit:
  parallel: false
  commands:
    # Форматируем ВЕСЬ проект (Kotlin, KTS, Markdown) через Spotless
    spotless-format:
      run: ./gradlew spotlessApply && git add {staged_files}

    # Проверяем, что после форматирования не осталось не добавленных изменений
    check-format:
      run: git diff --exit-code || (echo "❌ Файлы были отформатированы. Сделайте git add и повторите коммит." && exit 1)

    # 2. Запуск тестов перед коммитом (отклонит коммит, если тесты упадут)
    # ВНИМАНИЕ: Если тестов много, это может быть долго.
    # Если тормозит - перенеси этот блок в секцию "pre-push".
    run-tests:
      run: ./gradlew test testDebugUnitTest

post-commit:
  commands:
    # 3. Добавление изменений в CHANGELOG для фиче-веток
    append-changelog:
      run: |
        BRANCH=$(git branch --show-current)
        if [[ "$BRANCH" != "master" && "$BRANCH" != "dev" && "$BRANCH" != "HEAD" ]]; then
          # Берем сообщение последнего коммита и дописываем в конец файла
          MSG=$(git log -1 --pretty=%s)
          echo "- [${BRANCH}] ${MSG}" >> CHANGELOG.md
          git add CHANGELOG.md
          # Амэндим коммит, чтобы CHANGELOG попал в этот же коммит
          git commit --amend --no-edit --no-verify
        fi
      # Выполняем только если коммит не был сделан с флагом --no-verify
      exclude_tags: "skip-changelog"
