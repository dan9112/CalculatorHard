pre-commit:
  parallel: false
  commands:
    # Проверяем и форматируем только Kotlin файлы из текущего git add
    spotless-format:
      glob: "*.{kt,kts}"
      run: ./gradlew spotlessApply -PspotlessFiles="{staged_files}"
      stage_fixed: true

    # Прогон юнит-тестов перед фиксацией коммита
    run-tests:
      run: ./gradlew test testDebugUnitTest
