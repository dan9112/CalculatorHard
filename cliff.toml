[changelog]
# Шаблон заголовка
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
# Шаблон тела (самого списка изменений)
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
# Включаем поддержку Conventional Commits
conventional_commits = true
filter_unconventional = true
split_commits = false

# Настраиваем группы для категорий (эмодзи)
commit_parsers = [
    { body = ".*security", group = "🛡️ Security" },
    { message = "^build", group = "📦 Build" },
    { message = "^chore\\(release\\):", skip = true }, # Пропускаем коммиты от самого бота релиза
    { message = "^chore", group = "⚙️ Miscellaneous Chores" },
    { message = "^ci", group = "👷 CI/CD" },
    { message = "^doc", group = "📚 Documentation" },
    { message = "^feat", group = "🚀 Features" },
    { message = "^fix", group = "🐛 Bug Fixes" },
    { message = "^perf", group = "⚡ Performance" },
    { message = "^refactor", group = "🚜 Refactor" },
    { message = "^revert", group = "◀️ Revert" },
    { message = "^style", group = "🎨 Styling" },
    { message = "^test", group = "🧪 Testing" },
]

# Защита от цикличных запусков
protect_breaking_commits = false
skip_tags = ""
